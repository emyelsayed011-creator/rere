# =============================================================================
# nginx config for the Samsary SPA container.
# - Serves the compiled Angular files.
# - Falls back to index.html so client-side routing (deep links) works.
# - Reverse-proxies /api and /hubs to the API container ("api" = compose service).
# =============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't let the service worker get stuck on a stale copy.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: serve the file if it exists, otherwise hand routing to Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> API container. The /api prefix is preserved (controllers use /api/...).
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_pass_header  Authorization;
    }

    # SignalR (chat + notifications) needs WebSocket upgrade headers.
    location /hubs/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 100s;
    }
}
